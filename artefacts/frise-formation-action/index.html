<script>
var DATA = {"title": {"text": {"headline": "Une formation-action nationale rencontre la lisière Sud-Berry / Creuse", "text": "<p>Comment un dispositif conçu pour circuler de territoire en territoire croise-t-il un lieu qui a sa propre histoire ?</p><p>La frise rassemble ce qui a rendu cette rencontre possible : des idées partagées depuis longtemps, des pratiques d'enquête qui se renouvellent, des dynamiques locales anciennes, des réflexions menées en parallèle avant tout contact.</p><p>La frise cherche à éviter de présenter rétrospectivement des trajectoires parallèles comme si elles avaient toujours été coordonnées. Elle donne ainsi à voir une rencontre qui possède une histoire, mais dont l'issue n'est pas prédéterminée.</p><p class=\"src\">En savoir plus : <a href=\"https://www.lelabo-ess.org/education-populaire-transition-juste\" target=\"_blank\" rel=\"noopener\">L'éducation populaire au service de la transition écologique juste</a> (Le Labo de l'ESS)</p><p class=\"src\">Document de travail. CC BY-SA.</p>"}, "background": {"color": "#F4F1EA"}, "media": {"url": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20640%20400%22%20font-family%3D%22Georgia%2Cserif%22%3E%3Crect%20width%3D%22640%22%20height%3D%22400%22%20rx%3D%2214%22%20fill%3D%22%23FFFFFF%22/%3E%3Crect%20x%3D%22470%22%20y%3D%2230%22%20width%3D%22150%22%20height%3D%22300%22%20rx%3D%228%22%20fill%3D%22%23F4F1EA%22/%3E%3Ctext%20x%3D%22545%22%20y%3D%2252%22%20text-anchor%3D%22middle%22%20font-size%3D%2215%22%20fill%3D%22%23555%22%3ERencontre%3C/text%3E%3Ctext%20x%3D%2240%22%20y%3D%22350%22%20font-size%3D%2212%22%20fill%3D%22%23777%22%3E1972%3C/text%3E%3Ctext%20x%3D%22455%22%20y%3D%22350%22%20font-size%3D%2212%22%20fill%3D%22%23777%22%3E2026%3C/text%3E%3Ctext%20x%3D%22590%22%20y%3D%22350%22%20font-size%3D%2212%22%20fill%3D%22%23777%22%3E2027%3C/text%3E%3Cpath%20d%3D%22M40%2080%20H450%20C490%2080%20500%2080%20620%2080%22%20stroke%3D%22%232F5D8A%22%20st rg/2000/svg%22%20viewBox%3D%220%200%20640%20400%22%3E%3Crect%20width%3D%22640%22%20height%3D%22400%22%20rx%3D%2214%22%20fill%3D%22%23FFFFFF%22%20stroke%3D%22%231F6F77%22%20stroke-width%3D%224%22%20stroke-dasharray%3D%2214%2010%22/%3E%3Ctext%20x%3D%22320%22%20y%3D%22210%22%20text-anchor%3D%22middle%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2228%22%20fill%3D%22%231F6F77%22%3Em%C3%A9dia%20%C3%A0%20venir%3C/text%3E%3C/svg%3E"}, "_import": "g7-29"}, {"unique_id": "s5-charte-2017", "group": "5 Pratiques d'enquête", "start_date": {"year": "2017"}, "text": {"headline": "Charte des sciences et recherches participatives", "text": "<p>Signée par une trentaine d'établissements, d'ONG et d'associations.</p><p class=\"src\">Source : <a href=\"https://www.science-ensemble.org/pdf/charte-francaise-des-sciences-et-recherches-participatives.pdf\" target=\"_blank\" rel=\"noopener\">Charte</a></p>"}, "background": {"color": "#E3F1F2"}, "media": {"url": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20640%20400%22%3E%3Crect%20width%3D%22640%22%20height%3D%22400%22%20rx%3D%2214%22%20fill%3D%22%23FFFFFF%22%20stroke%3D%22%231F6F77%22%20stroke-width%3D%224%22%20stroke-dasharray%3D%2214%2010%22/%3E%3Ctext%20x%3D%22320%22%20y%3D%22210%22%20text-anchor%3D%22middle%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2228%22%20fill%3D%22%231F6F77%22%3Em%C3%A9dia%20%C3%A0%20venir%3C/text%3E%3C/svg%3E"}}, {"unique_id": "s5-co3-2017", "group": "5 Pratiques d'enquête", "start_date": {"year": "2017"}, "text": {"headline": "CO3 : co-construction des connaissances", "text": "<p>ADEME et Sciences Citoyennes : 248 projets déposés, 44 financés.</p>"}, "background": {"color": "#E3F1F2"}, "media": {"url": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20640%20400%22%3E%3Crect%20width%3D%22640%22%20height%3D%22400%22%20rx%3D%2214%22%20fill%3D%22%23FFFFFF%22%20stroke%3D%22%231F6F77%22%20stroke-width%3D%224%22%20stroke-dasharray%3D%2214%2010%22/%3E%3Ctext%20x%3D%22320%22%20y%3D%22210%22%20text-anchor%3D%22middle%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2228%22%20fill%3D%22%231F6F77%22%3Em%C3%A9dia%20%C3%A0%20venir%3C/text%3E%3C/svg%3E"}, "_import": "g7-33"}, {"unique_id": "s5-delahais-2022", "group": "5 Pratiques d'enquête", "start_date": {"year": "2022"}, "text": {"headline": "Cinq choses à savoir sur les initiatives de transition", "text": "<p>Thomas Delahais, programme ISOPOLIS.</p><p class=\"src\">Source : <a href=\"https://www.quadrant-conseil.fr/pico/?blog%2F20220502\" target=\"_blank\" rel=\"noopener\">Quadrant Conseil</a></p>"}, "background": {"color": "#E3F1F2"}, "media": {"url": "<blockquote class=\"gauche\"><p>À l'initiative du programme réunionnais <a href=\"https://www.isopolis.re/fr/1/home.html\" target=\"_blank\" rel=\"noopener\">ISOPOLIS</a>, Thomas Delahais est intervenu sur le thème : « 5 choses à savoir sur les initiatives de transition » devant une centaine d'acteurs de la société civile, des collectivités et d'autres secteurs à La Réunion.</p><p>Ces cinq choses sont :</p><ul><li>Peut-être la plus importante : la transition, en vrai, on ne sait pas faire, personne ne sait faire</li><li>L'enjeu c'est créer de la dynamique, de la mise en mouvement</li><li>Pour bouger il va falloir changer la fabrique de l'action publique et de l'action d'intérêt général plus largement</li><li>La transition c'est semer beaucoup de graines et acceptez que toutes ne germent pas</li><li>La transition ça prend du temps…</li></ul></blockquote>"}, "_import": "g2-46"}, {"unique_id": "s5-isopolis-2024", "group": "5 Pratiques d'enquête", "start_date": {"year": "2024"}, "text": {"headline": "ISOPOLIS", "text": "<p>Les enjeux d'une alliance science-société à l'initiative de la société civile.</p><p class=\"src\">Source : <a href=\"https://www.participation-et-democratie.fr/isopolis-ou-les-enjeux-d-une-alliance-science-societe-a-l-initiative-de-la-societe-civile\" target=\"_blank\" rel=\"noopener\">GIS Démocratie et Participation</a></p>"}, "background": {"color": "#E3F1F2"}, "media": {"url": "<blockquote class=\"gauche\"><p>Le programme ISOPOLIS Gamma, engagé à l'initiative de la société civile réunionnaise et porté par l'institut de recherche et de développement (IRD), s'est déroulé de juin 2021 à janvier 2023. Il se distingue très tôt par une volonté de construire une alliance entre la société civile et la recherche, dans un territoire marqué par la méfiance envers la science et les chercheurs.</p><p>Cette volonté se heurte cependant à de nombreux malentendus, qui représentent à la fois des obstacles au déroulement, mais ont aussi parfois été des occasions fertiles pour les acteurs de trouver leur place, et pour l'agenda d'ISOPOLIS de progresser.</p></blockquote>"}, "_import": "g2-54"}, {"unique_id": "s4-plateaux-1974", "group": "4 Local-lisière", "start_date": {"year": "1974"}, "text": {"headline": "Création de l'association des Plateaux Limousins", "text": "<p>Royère-de-Vassivière, Creuse.</p><p class=\"src\">Source : <a href=\"https://www.journal-ipns.org/les-articles/709-etre-du-plateau-de-millevaches-exemple-d-un-territoire-en-construction\" target=\"_blank\" rel=\"noopener\">IPNS, « Être du plateau de Millevaches »</a></p>"}, "background": {"color": "#F6EAE3"}, "media": {"url": "<blockquote class=\"gauche\"><p class=\"cit\">« Quand on me dit qu'il n'y a rien à faire, je me dis qu'il y a tant qu'à faire. »</p><p class=\"cit\">« Ce n'est pas le tout d'avoir des programmes, ce n'est pas le tout d'avoir des gens qui font des projets, il faut qu'il y ait un peuple qui se lève, il faut qu'il y ait une conscience commune qui se fasse… »</p><p>Charles Rousseau, créateur des Plateaux Limousins, personne source.</p></blockquote>"}}, {"unique_id": "s4-adar-1984", "group": "4 Local-lisière", "start_date": {"year": "1984"}, "text": {"headline": "Création de l'ADAR-CIVAM", "text": "<p>Association d oire</i> (Actes Sud).</p><p class=\"lien\">Masterclass Sator : <a href=\"https://youtu.be/0v1sLi7zicQ?si=cFmcvpbhiVP7HCqJ\" target=\"_blank\" rel=\"noopener\">vidéo de présentation</a> · <a href=\"https://www.sator.fr/formations/conduire-la-transition-dans-les-territoires\" target=\"_blank\" rel=\"noopener\">le cours</a></p>"}, "background": {"color": "#F6EAE3"}, "display_date": "10 novembre 2026", "media": {"url": "media/telagora-leroy.jpg"}}, {"unique_id": "s4-geographie-sensible-2024", "group": "4 Local-lisière", "start_date": {"year": "2024", "month": "4"}, "text": {"headline": "La géographie sensible des associations locales en milieu rural", "text": "<p>Recherche lauréate de l'IFMA en Creuse, à partir de trois associations : Recherche en Ruralité (Maïlys Kydjian) et Les Plateaux Limousins (Aurélie Martin), réseau Aliso.</p><p class=\"src\">Source : <a href=\"https://institutfrancaisdumondeassociatif.org/recherches-laureates/la-geographie-sensible-des-associations-locales-en-milieu-rural/\" target=\"_blank\" rel=\"noopener\">IFMA</a></p>"}, "background": {"color": "#F6EAE3"}, "display_date": "avril 2024 - janvier 2026", "media": {"url": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20640%20400%22%3E%3Crect%20width%3D%22640%22%20height%3D%22400%22%20rx%3D%2214%22%20fill%3D%22%23FFFFFF%22%20stroke%3D%22%23A8481F%22%20stroke-width%3D%224%22%20stroke-dasharray%3D%2214%2010%22/%3E%3Ctext%20x%3D%22320%22%20y%3D%22210%22%20text-anchor%3D%22middle%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2228%22%20fill%3D%22%23A8481F%22%3Em%C3%A9dia%20%C3%A0%20venir%3C/text%3E%3C/svg%3E"}}, {"unique_id": "s4-renault-tinacci-2025", "group": "4 Local-lisière", "start_date": {"year": "2025"}, "text": {"headline": "Enquête sur la participation associative en milieu rural, Creuse", "text": "<p>Mathilde Renault-Tinacci, sociologue à l'INJEP, chercheuse associée au CERLIS.</p><p class=\"src\">Source : <a href=\"https://www.cerlis.eu/renault-tinacci-mathilde/\" target=\"_blank\" rel=\"noopener\">CERLIS</a></p>"}, "background": {"color": "#F6EAE3"}, "display_date": "2025-2027", "media": {"url": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20640%20400%22%3E%3Crect%20width%3D%22640%22%20height%3D%22400%22%20rx%3D%2214%22%20fill%3D%22%23FFFFFF%22%20stroke%3D%22%23A8481F%22%20stroke-width%3D%224%22%20stroke-dasharray%3D%2214%2010%22/%3E%3Ctext%20x%3D%22320%22%20y%3D%22210%22%20text-anchor%3D%22middle%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2228%22%20fill%3D%22%23A8481F%22%3Em%C3%A9dia%20%C3%A0%20venir%3C/text%3E%3C/svg%3E"}}, {"unique_id": "s4-marche-ombre-2026", "group": "4 Local-lisière", "start_date": {"year": "2026", "month": "9", "day": "26"}, "text": {"headline": "« Marche à l'ombre », spécial journée asso", "text": "<p>Radio Pays de Guéret, avec des collectifs et associations du département.</p><p class=\"src\">Source : <a href=\"https://www.radiopaysdegueret.fr/marche-a-lombre/malo-special-journee-asso-26-09\" target=\"_blank\" rel=\"noopener\">Radio Pays de Guéret</a></p>"}, "background": {"color": "#F6EAE3"}, "display_date": "26 septembre 2026", "media": {"url": "<blockquote class=\"gauche\"><p>Diffusion de l'émission enregistrée pour le mouvement du 26 septembre, pour le climat, le vivant, la paix et la justice sociale.</p><p>Étaient présents : le collectif citoyen de La Souterraine, Bucolesque, @cycl.aune, Nous Toutes Creuse, Abrickadabra, MJC CS La Souterraine, Écoute l'arbre et la feuille, Demin-Demin, Culin'art et Mathilde Renault-Tinacci de l'INJEP !</p></blockquote>"}}, {"unique_id": "s4-forum-rural-2026", "group": "4 Local-lisière", "start_date": {"year": "2026", "month": "11", "day": "17"}, "text": {"headline": "« S'engager bénévolement en milieu rural : faire sa place, faire face, faire territoire »", "text": "<p>Forum national de l'ESS, Niort, 15 h 30. Pier Jeannot (réseau TELA), Mathilde Renault-Tinacci (INJEP, CERLIS), Maïlys Kydjian (sociologue, Creuse), Alexandre Valles (Mon P'tit Camion).</p><p class=\"src\">Source : <a href=\"https://forum-ess.fr/programme/programme-detaille/session/sengager-benevolement-en-milieu-rural-faire-sa-place-faire-face-faire-territoire/\" target=\"_blank\" rel=\"noopener\">Forum national de l'ESS</a></p>"}, "background": {"color": "#F6EAE3"}, "display_date": "17 novembre 2026", "media": {"url": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20640%20400%22%3E%3Crect%20width%3D%22640%22%20height%3D%22400%22%20rx%3D%2214%22%20fill%3D%22%23FFFFFF%22%20stroke%3D%22%23A8481F%22%20stroke-width%3D%224%22%20stroke-dasharray%3D%2214%2010%22/%3E%3Ctext%20x%3D%22320%22%20y%3D%22210%22%20text-anchor%3D%22middle%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2228%22%20fill%3D%22%23A8481F%22%3Em%C3%A9dia%20%C3%A0%20venir%3C/text%3E%3C/svg%3E"}}, {"unique_id": "s4-table-ronde-2026", "group": "4 Local-lisière", "start_date": {"year": "2026", "month": "8", "day": "29"}, "text": {"headline": "Table ronde « Le PNR Sud Berry : une vision commune pour le territoire ? »", "text": "<p>Foire Bio de Neuvy-Saint-Sépulchre.</p>"}, "background": {"color": "#F6EAE3"}, "display_date": "29 août 2026", "media": {"url": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20640%20400%22%3E%3Crect%20width%3D%22640%22%20height%3D%22400%22%20rx%3D%2214%22%20fill%3D%22%23FFFFFF%22%20stroke%3D%22%23A8481F%22%20stroke-width%3D%224%22%20stroke-dasharray%3D%2214%2010%22/%3E%3Ctext%20x%3D%22320%22%20y%3D%22210%22%20text-anchor%3D%22middle%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2228%22%20fill%3D%22%23A8481F%22%3Em%C3%A9dia%20%C3%A0%20venir%3C/text%3E%3C/svg%3E"}, "_import": "g6-tableronde-2026"}, {"unique_id": "s5-callisto-2026", "group": "5 Pratiques d'enquête", "start_date": {"year": "2024", "month": "2", "day": "29"}, "text": {"headline": "Science citoyenne orientée vers l'action", "text": "<p>« Les projets de science citoyenne orientés vers l'action encouragent l'intervention des participants dans les préoccupations locales, en utilisant la recherche scientifique comme un outil pour soutenir les agendas civiques. »</p><p class=\"src\">Source : <a href=\"https://callisto-formation.fr/course/view.php?id=320&amp;section=1\" target=\"_blank\" rel=\"noopener\">Callisto, cours « Sciences et recherches participatives »</a></p>"}, "background": {"color": "#E3F1F2"}, "display_date": "29 février 2024", "media": {"url": "<blockquote class=\"gauche\"><p><b>Des projets scientifiques ?</b></p><p>Pour Wiggins et Crowston, les projets de ce type ne sont pas d'abord des projets scientifiques, mais d'abord des projets citoyens, qui nécessitent un soutien scientifique. Ainsi, écrivent-ils, les chercheurs y sont « plutôt des consultants ou des collaborateurs que les initiateurs ».</p><p>Pour autant, cet accompagnement scientifique n'est pas moins scientifique qu'un autre projet de recherche. Il se fait à l'initiative de la société civile, plutôt qu'à celle des chercheurs, mais requiert les mêmes méthodes scientifiques que tout autre projet.</p></blockquote>"}}, {"unique_id": "s1-mouvements-2013", "group": "1 Temps commun", "start_date": {"year": "2013", "month": "9"}, "text": {"headline": "« La transition, une utopie concrète ? »", "text": "<p>Éditorial de la revue Mouvements, par Fabrice Flipo, Simon Cottin-Marx et Antoine Lagneau.</p><p class=\"src\">Source : <a href=\"https://mouvements.info/edito/la-transition-une-utopie-concrete/\" target=\"_blank\" rel=\"noopener\">mouvements.info</a></p>"}, "background": {"color": "#E7EEF6"}, "display_date": "automne 2013", "media": {"url": "<blockquote class=\"gauche\"><p>Numéro 75 de la revue Mouvements, paru à l'automne 2013 et consacré au mouvement de la transition : des initiatives locales et citoyennes qui cherchent des modes de vie moins dépendants du pétrole.</p><p>L'éditorial interroge le rapport au politique de ce mouvement, qui préfère construire des alternatives concrètes plutôt que s'inscrire dans la confrontation.</p><p class=\"cit\">« …L'utopiste, dans ce sens-là, va donc éviter de s'enfermer, au nom du principe d'inclusivité, dans une identité trop reconnaissable (« anticapitaliste », « écologiste » etc.). Il joue la créativité, collectivement, contre l'inertie des assemblages sociaux établis, prisonniers de leur histoire, de leur structure, de leurs cadres idéologiques. D'où la diversité d'étiquettes (transition, décroissance etc.) pour des mouvements similaires, qui ont tous en commun de ne pas pouvoir se référer à des situations facilement agrégeables à grande échelle, à la différence des grèves par exemple… »</p></blockquote>"}, "_import": "g2-19"}, {"unique_id": "s4-recherche-buissonniere-2026", "group": "4 Local-lisière", "start_date": {"year": "2026", "month": "11", "day": "16"}, "text": {"headline": "recherche-buissonniere.cooplab.org", "text": "<p>Le tiers secteur de la recherche en Sud Berry/Creuse. L'espace se pense à partir des travaux de Raphaëlle Bats :</p><ul><li><i>Lectures sensibles de la science. Un guide de médiation de la recherche</i>, sous la direction de Raphaëlle Bats et Mathilde Garnier (projet ECODOC, Université de Bordeaux, juin 2025, CC BY) ;</li><li>le cours Callisto « Sciences et recherches participatives », section « Action locale » ;</li><li>la conférence de Biganos sur les bibliothèques intérieures (janvier 2024, année probable).</li></ul><p class=\"src\">Sources : <a href=\"https://zenodo.org/records/15771901\" target=\"_blank\" rel=\"noopener\">Zenodo, Lectures sensibles de la science</a> · <a href=\"https://callisto-formation.fr/course/view.php?id=320&amp;section=1\" target=\"_blank\" rel=\"noopener\">Callisto, section « Action locale »</a> · <a href=\"https://recherche-buissonniere.cooplab.org\" target=\"_blank\" rel=\"noopener\">recherche-buissonniere.cooplab.org</a></p>"}, "background": {"color": "#F6EAE3"}, "display_date": "16 novembre 2026"}, {"unique_id": "s2-unadel-edito-2026", "group": "2 Dispositifs nationaux", "start_date": {"year": "2026", "month": "11", "day": "5"}, "display_date": "5 novembre 2026", "text": {"headline": "Unadel, édito : « Les territoires à l'épreuve d'un changement de cap »", "text": "<p>Éditorial de novembre, par Stéphane Loukianoff.</p><p class=\"src\">Source : <a href=\"https://unadel.org/edito-novembre-2026/\" target=\"_blank\" rel=\"noopener\">unadel.org</a></p>"}, "background": {"color": "#EFE8F6"}, "media": {"url": "<blockquote class=\"gauche\"><p class=\"cit\">« … Dans les territoires aussi, l’heure n’est plus aux promesses d’un progrès linéaire. Le « en même temps » de la croissance verte apparaît de moins en moins tenable face aux réalités climatiques et à la pénurie d’argent public. De nombreux élus locaux, dont le mandat débute à peine, prennent conscience que l’enjeu central des prochaines années consistera avant tout à maintenir l’habitabilité de leur territoire au lieu de renforcer son attractivité. Il va falloir mobiliser prioritairement les moyens financiers des collectivités dans la transformation des crèches et des écoles pour les adapter au changement climatique, ou encore sécuriser les réseaux d’eau et d’énergie pour les prochaines années… »</p><p>Stéphane Loukianoff, Unadel</p></blockquote>"}}, {"unique_id": "s2-etabli-52-2026", "group": "2 Dispositifs nationaux", "start_date": {"year": "2026", "month": "11", "day": "6"}, "display_date": "6 novembre 2026", "text": {"headline": "Fabrique des transitions, L'établi n° 52 : « Ne rien céder. Faire alliance ! »", "text": "<p>Lettre d'information de la Fabrique des transitions.</p><p class=\"src\">Source : <a href=\"https://mailchi.mp/cb42397e51ce/etabli-n52-i-ne-rien-cder-faire-alliance\" target=\"_blank\" rel=\"noopener\">L'établi n° 52</a></p>"}, "background": {"color": "#EFE8F6"}, "media": {"url": "<blockquote class=\"gauche\"><p class=\"cit\">« … Partout dans les territoires (TEPOS, en transition alimentaire, sur les enjeux santé), des forces de vie inventent déjà d’autres façons de produire, d’habiter, de décider et de coopérer. L’enjeu ? Les relier, les outiller, leur donner les moyens de changer d’échelle… »</p><p>L'établi n° 52, Fabrique des transitions</p></blockquote>"}}], "eras": [{"start_date": {"year": "1972"}, "end_date": {"year": "2026", "month": "8", "day": "24"}, "text": {"headline": "Deux temporalités séparées"}}, {"start_date": {"year": "2026", "month": "8", "day": "25"}, "end_date": {"year": "2027", "month": "2", "day": "28"}, "text": {"headline": "Rencontre"}}], "scale_factor": 1};
